<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Venta de Celulares{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Tienda de Celulares</h1>
        <nav>
            <a href="{{ url_for('inicio') }}">Inicio</a> |
            <a href="{{ url_for('about') }}">Acerca de</a> |
            <a href="{{ url_for('productos') }}">Productos</a> |
            <a href="{{ url_for('agregar') }}">Agregar producto</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>© 2026 - Venta de Celulares</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
